<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AfterTouch - Select Interface</title>
    <link rel="icon" href="/media/favicon-braille.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/web/shared/common.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 { color: #fff; margin-bottom: 30px; }
        .choices {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .choice-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            width: 200px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .choice-card:hover {
            transform: translateY(-5px);
            border-color: #00bcd4;
            background: #252525;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #00bcd4;
        }
        .desc {
            font-size: 0.9rem;
            color: #888;
        }
        footer {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>AfterTouch</h1>
        <p style="margin-top: -25px; font-style: italic; color: #666; margin-bottom: 30px;">Bose SoundTouch Toolkit</p>
        <p style="margin-bottom: 40px; color: #aaa;">Select an interface to continue.</p>

        <div class="choices">
            <a href="/web/stockholm-mini/" class="choice-card">
                <div class="icon">📻</div>
                <div class="title">Stockholm Mini</div>
                <div class="desc">Lightweight device controller and player.</div>
            </a>

            <a href="/web/migration/" class="choice-card">
                <div class="icon">⚙️</div>
                <div class="title">Migration</div>
                <div class="desc">Setup, data sync, and cloud migration toolkit.</div>
            </a>
        </div>
    </div>

    <footer>
        <span id="version-info">AfterTouch</span>
    </footer>

    <script src="/web/shared/common.js"></script>
    <script>
        fetchVersion();
    </script>
</body>
</html>
